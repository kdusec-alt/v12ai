name: V1080 Branch Regression

on:
  push:
    branches:
      - agent/v1080-entry-opportunity-engine
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TINO_OFFLINE_TEST: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile changed modules
        run: python -m py_compile entry_opportunity_v1080.py ui_v9_battle_panel.py test_entry_opportunity_v1080.py
      - name: Run full regression
        run: python -m unittest discover -v
