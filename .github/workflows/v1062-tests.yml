name: V1062-V1070 targeted tests

on:
  push:
    branches:
      - agent/tw-event-exposure-v1062
      - agent/low-entry-readiness-v1064
      - agent/responsive-desktop-v1065
      - agent/compact-decision-panel-v1066
      - agent/decision-evidence-spacing-v1067
      - agent/data-lifecycle-research-ui-v1068
      - agent/exchange-rule-reachability-v1069
      - agent/emerging-session-v1070
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  event-exposure-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run V1065 responsive UI contract
        run: python -m unittest -v test_responsive_ui_v1065.py
      - name: Run V1065 wait-price and consistency contract
        run: python -m unittest -v test_low_entry_readiness_v1065.py
      - name: Run V1066 compact decision panel contract
        run: python -m unittest -v test_compact_decision_panel_v1066.py
      - name: Run V1067 and V1068 evidence UI contracts
        run: python -m unittest -v test_decision_evidence_spacing_v1067.py
      - name: Run V1068 data lifecycle and research status tests
        run: python -m unittest -v test_v1068_data_lifecycle.py
      - name: Run V1069 exchange-rule and reachability tests
        run: python -m unittest -v test_exchange_rule_v1069.py
      - name: Run V1070 emerging session tests
        run: python -m unittest -v test_emerging_session_v1070.py
      - name: Run V1087-V1089 cross-module and ETF contracts
        run: >-
          python -c "import test_v1087_cross_module_language_contract as m;
          tests=[getattr(m,n) for n in dir(m) if n.startswith('test_')];
          [t() for t in tests];
          print(f'cross_module_contracts={len(tests)}/{len(tests)}')"
      - name: Run V1093-V1096 single decision lifecycle audit contracts
        run: python -m unittest -v test_v1096_single_decision_lifecycle_audit.py
      - name: Run event and low-entry tests
        run: |
          python -m unittest -v \
            test_ticker_event_exposure.py \
            test_event_intelligence_v1062.py \
            test_market_shock_indicator.py \
            test_decision_narrative_v1062.py \
            test_low_entry_readiness_v1064.py
