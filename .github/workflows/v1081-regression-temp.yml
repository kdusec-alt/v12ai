name: V1081 Temporary Full Regression

on:
  push:
    branches:
      - agent/v1081-web-decision-architecture-audit
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Compile production modules
        run: |
          python -m py_compile decision_architecture_v1081.py session_truth_v1081.py market_command_v1081.py news_reassessment_priority_v1081.py learning_integrity_v1081.py analysis_speed_v1081.py entry_opportunity_v1080.py ui_v9_battle_panel.py app.py learning.py auto_audit_scheduler.py
      - name: Full regression
        run: python -m unittest discover -p 'test_*.py' -v
