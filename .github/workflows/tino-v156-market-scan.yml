name: TINO V156 Daily Market Scan and V1118 Paper Research

on:
  schedule:
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

concurrency:
  group: tino-v156-daily-market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify required secrets before scanning
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "Missing GOOGLE_SERVICE_ACCOUNT_JSON secret"; exit 1; }
          test -n "$GOOGLE_DRIVE_FOLDER_ID" || { echo "Missing GOOGLE_DRIVE_FOLDER_ID secret"; exit 1; }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install scanner and analysis dependencies
        run: python -m pip install -r requirements.txt -r market_scanner_v156/requirements.txt
      - name: Run V156 market discovery
        run: python market_scanner_v156/tino_v156_scanner.py --mode scheduled --output-dir ./scanner_output
      - name: Publish completed snapshot to Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python market_scanner_v156/drive_publish.py ./scanner_output
      - name: Run V1118 autonomous paper decisions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TINO_GITHUB_REPO: ${{ github.repository }}
          TINO_GITHUB_BRANCH: tino-memory
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TINO_AI_RESEARCH_MODEL: gpt-5-mini
        run: python autonomous_paper_v1118.py --snapshot-dir ./scanner_output
