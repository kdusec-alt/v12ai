name: TINO V156 Daily Market Scan

on:
  # 05:00 Asia/Taipei on weekdays = 21:00 UTC on Sun-Thu.
  schedule:
    - cron: "0 21 * * 0-4"
  workflow_dispatch:

concurrency:
  group: tino-v156-daily-market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify required secrets before scanning
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "Missing GOOGLE_SERVICE_ACCOUNT_JSON secret"; exit 1; }
          test -n "$GOOGLE_DRIVE_FOLDER_ID" || { echo "Missing GOOGLE_DRIVE_FOLDER_ID secret"; exit 1; }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: market_scanner_v156/requirements.txt
      - name: Install scanner dependencies
        run: python -m pip install -r market_scanner_v156/requirements.txt
      - name: Run V156 scan
        run: python market_scanner_v156/tino_v156_scanner.py --mode scheduled --output-dir ./scanner_output
      - name: Publish complete snapshot to Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python market_scanner_v156/drive_publish.py ./scanner_output
