name: V1080 Full Regression

on:
  push:
    branches:
      - agent/v1080-entry-opportunity-engine
    paths-ignore:
      - docs/v1080_regression_result.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TINO_OFFLINE_TEST: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/v1080-entry-opportunity-engine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Run and publish regression result
        shell: bash
        run: |
          set +e
          mkdir -p docs
          RESULT=docs/v1080_regression_result.txt
          LOG=/tmp/v1080_regression.log
          : > "$LOG"
          echo "V1080 FULL REGRESSION" > "$RESULT"
          echo "commit=$GITHUB_SHA" >> "$RESULT"
          echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$RESULT"

          python -m pip install --upgrade pip >> "$LOG" 2>&1
          python -m pip install -r requirements.txt >> "$LOG" 2>&1
          INSTALL_STATUS=$?

          COMPILE_STATUS=99
          TEST_STATUS=99
          if [ "$INSTALL_STATUS" -eq 0 ]; then
            python -m py_compile entry_opportunity_v1080.py ui_v9_battle_panel.py test_entry_opportunity_v1080.py >> "$LOG" 2>&1
            COMPILE_STATUS=$?
            if [ "$COMPILE_STATUS" -eq 0 ]; then
              python -m unittest discover -v >> "$LOG" 2>&1
              TEST_STATUS=$?
            fi
          fi

          echo "install_status=$INSTALL_STATUS" >> "$RESULT"
          echo "compile_status=$COMPILE_STATUS" >> "$RESULT"
          echo "test_status=$TEST_STATUS" >> "$RESULT"
          echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$RESULT"
          echo "--- REGRESSION LOG ---" >> "$RESULT"
          cat "$LOG" >> "$RESULT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT"
          git commit -m "test: publish V1080 full regression result [skip ci]" || true
          git push origin HEAD:agent/v1080-entry-opportunity-engine

          if [ "$INSTALL_STATUS" -ne 0 ] || [ "$COMPILE_STATUS" -ne 0 ] || [ "$TEST_STATUS" -ne 0 ]; then
            exit 1
          fi
